<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email & Password Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="validator-card">

            <h1>Account Validator</h1>
            <p class="subtitle">Enter your email and password</p>

            <form id="validatorForm">

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input
                        autocomplete="off"
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >
                    <small id="emailMessage"></small>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >
                    <small id="passwordMessage"></small>
                </div>

                <button type="submit">
                    Validate
                </button>

                <p id="result"></p>

            </form>

        </div>

    </div>

    <script src="JSDOM.js"></script>
</body>
</html>
