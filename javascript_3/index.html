<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <link rel="stylesheet" href="sty;e.css">

<body>

    <main class="container users">

        <!-- Add User Form -->
        <section class="form-card">

            <h1>Add User</h1>
            <p class="form-subtitle">Create a new user profile</p>

            <form id="userForm">

                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter user name">
                </div>

                <div class="input-group">
                    <label for="role">Role</label>
                    <input type="text" id="role" placeholder="e.g. Frontend Developer">
                </div>

                <div class="input-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" placeholder="Write a short bio..."></textarea>
                </div>

                <div class="input-group">
                    <label for="photo">Photo URL</label>
                    <input type="url" id="photo" placeholder="https://example.com/photo.jpg">
                </div>

                <button type="submit">
                    Add User
                </button>

            </form>

        </section>


        <!-- Users -->
        <section class="users-section">

            <div class="users-header">
                <h2>Users</h2>
                <span>3 Profiles</span>
            </div>
